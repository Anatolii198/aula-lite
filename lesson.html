<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson — Aula</title>
<meta name="description" content="A lesson of the course: video, materials and the task.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf9f6">

<!-- Open Graph. Before launch put your own address and a 1200×630 picture
     here; og:image wants an absolute URL, not a relative one. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Online school of photography">
<meta property="og:description" content="Three courses from the first manual frame to studio light. First lesson free.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2572f'/%3E%3Cpath d='M9 22V10h5.5a3.5 3.5 0 0 1 0 7H9' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">

<!-- The theme, before the first paint. Without these lines a visitor on the
     light theme sees one dark frame while the page loads. -->
<script>
  try {
    var saved = localStorage.getItem('aula-theme');
    document.documentElement.dataset.theme =
      saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) { /* private window: light stays */ }
</script>
</head>
<body>

<a class="skip" href="#main" data-i18n="misc.skip">Skip to content</a>

<!-- ======================================================= header ==== -->
<header class="hdr" id="hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="index.html">
      <span class="brand-mark">A</span>
      <span class="brand-txt">
        <b data-name>Aula</b>
        <i data-tagline>—</i>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Main">
      <a href="index.html#courses" data-i18n="nav.courses">Courses</a>
      <a href="index.html#how" data-i18n="nav.how">How it works</a>
      <a href="index.html#teacher" data-i18n="nav.teacher">Teacher</a>
    </nav>

    <div class="tools">
      <label class="sr" for="lang" data-i18n="nav.lang">Language</label>
      <select id="lang" class="lang"></select>

      <button class="icon" id="theme" type="button" aria-pressed="false">
        <span class="sr" data-i18n="nav.theme">Light or dark</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M20 14.2A8.4 8.4 0 019.8 4 8.4 8.4 0 1020 14.2z"/></svg>
      </button>

      <a class="btn btn-sm" href="course.html?id=basics" data-i18n="nav.start">Start learning</a>

      <button class="icon burger" id="burger" type="button" aria-expanded="false" aria-controls="nav">
        <span class="sr" data-i18n="nav.menu">Menu</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h17M3.5 12h17M3.5 17h17"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

<section class="sec" data-lesson>
  <div class="wrap wrap-narrow">
    <div class="lesson-top">
      <a href="#" data-l-course>—</a>
      <span class="meta" data-l-meta>—</span>
      <span class="free" data-l-free hidden data-i18n="lesson.free">Free lesson</span>
    </div>

    <h1 class="h2" style="margin-bottom:18px" data-l-title>—</h1>

    <div class="video" data-l-video style="background-image:url('img/lesson.jpg')">
      <span class="play" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </span>
    </div>
    <p class="demo-note" data-i18n="lesson.demo">—</p>

    <div class="lesson-act">
      <button class="btn btn-go" type="button" data-l-done>—</button>
      <div class="bar"><i data-l-bar style="width:0%"></i></div>
      <span class="meta" data-l-progress>—</span>
    </div>

    <h2 class="h2" style="font-size:1.4rem;margin-bottom:12px" data-i18n="lesson.materials">Materials</h2>
    <ul class="mat">
      <li><a href="#" data-i18n="lesson.m1">Lesson notes, PDF</a></li>
      <li><a href="#" data-i18n="lesson.m2">Raw files to practise on</a></li>
    </ul>

    <div class="task">
      <h3 data-i18n="lesson.task">Task</h3>
      <p data-i18n="lesson.task.d">—</p>
    </div>

    <nav class="lesson-nav">
      <a class="btn btn-ghost" href="#" data-l-prev data-i18n="lesson.prev">Previous</a>
      <a class="btn" href="#" data-l-next data-i18n="lesson.next">Next lesson</a>
    </nav>
  </div>
</section>

</main>

<!-- ======================================================== footer ==== -->
<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <h4 data-name>Aula</h4>
      <p class="fine" data-tagline>—</p>
    </div>
    <div>
      <h4 data-i18n="foot.courses">Courses</h4>
      <ul data-foot-courses></ul>
    </div>
    <div>
      <h4 data-i18n="foot.contact">Contact</h4>
      <ul data-contacts></ul>
    </div>
    <div class="foot-end">
      <p class="fine">© <span data-year>—</span> <span data-name>Aula</span>. <span data-i18n="foot.rights">All rights reserved.</span></p>
      <p class="fine" data-i18n="foot.note">—</p>
      <a class="fine up" href="#" data-i18n="foot.top">Back to top</a>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/courses.js"></script>
<script src="js/i18n.js"></script>
<script src="js/progress.js"></script>
<script src="js/main.js"></script>
</body>
</html>
